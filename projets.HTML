<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLANIT AI - Task Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-white border-b px-8 py-4 flex justify-between items-center">
    <a href="index.html"><img class="w-20" src="img/Logo futuriste Planit AI en orbite.png" alt="logo planit ai"></a>
    <ul class="flex items-center gap-5 list-none">
      <li><a href="index.html" class="bg-gray-200 text-sm px-5 py-2 rounded-md hover:bg-gray-500 hover:text-white transition">Dashboard</a></li>
      <li><a href="plan.html" class="bg-indigo-600 text-white text-sm px-5 py-2 rounded-md hover:bg-gray-500 transition">Nouveau projet</a></li>
      <li><button id="ninja" class="bg-gray-200 text-sm px-5 py-2 rounded-md hover:bg-gray-500 hover:text-white transition">Paramètres IA</button></li>
    </ul>
  </header>

  <main class="max-w-7xl mx-auto py-8 px-4">
   
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-gray-200/50 p-4 rounded-xl space-y-4">
        <h3 class="font-bold text-gray-700">To Do</h3>
        <div id="genin" class="space-y-3"></div>
      </div>
      <div class="bg-gray-200/50 p-4 rounded-xl space-y-4">
        <h3 class="font-bold text-gray-700">In Progress</h3>
        <div id="chunin" class="space-y-3"></div>
      </div>
      <div class="bg-gray-200/50 p-4 rounded-xl space-y-4">
        <h3 class="font-bold text-gray-700">Done</h3>
        <div id="jonin" class="space-y-3"></div>
      </div>
    </div>
  </main>


</body>
</html>
