<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLANIT AI - Task Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-300 text-gray-800 font-sans min-h-screen">
  <header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
    <a href="index.html"><img class="w-20" src="img/Logo futuriste Planit AI en orbite.png" alt="logo planit ai" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'PLANIT AI',className:'font-bold text-indigo-600'}))"></a>
    <ul class="flex items-center gap-5 list-none">
      <li><a href="index.html" class="bg-gray-200 text-sm px-5 py-2.5 rounded-md hover:bg-gray-500 hover:text-white transition">Dashboard</a></li>
      <li><a href="plan.html" class="bg-gray-200 text-sm px-5 py-2.5 rounded-md hover:bg-gray-500 hover:text-white transition">Nouveau projet</a></li>
      <li><button id="ninja" class="bg-gray-200 text-sm px-5 py-2.5 rounded-md hover:bg-gray-500 hover:text-white transition">Paramètres IA</button></li>
    </ul>
  </header>

  <main class="max-w-7xl mx-auto py-8 px-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
      <div class="bg-white p-4 rounded-xl shadow space-y-4">
        <h3 class="font-bold text-indigo-600 border-b pb-2">To Do</h3>
        <div id="genin" class="space-y-3"></div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow space-y-4">
        <h3 class="font-bold text-amber-600 border-b pb-2">In Progress</h3>
        <div id="chunin" class="space-y-3"></div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow space-y-4">
        <h3 class="font-bold text-emerald-600 border-b pb-2">Done</h3>
        <div id="jonin" class="space-y-3"></div>
      </div>
    </div>
  </main>

  <script src="demo.js"></script>
  <script src="dashbord.js"></script>
  <script src="parametres.js"></script>
  <script type="module" src="api.js"></script>
</body>
</html>
